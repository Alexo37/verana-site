<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verana — Arma tu semana</title>
<meta name="description" content="Arma tu caja de 5 smoothies Verana y pide por WhatsApp. Bolsitas de panelas que se disuelven en agua.">
<style>
/* Tipografia de marca: Bakso Menu (display) + Prompt (cuerpo/UI) */
@font-face{ font-family:'Bakso Menu'; src:url('verana-assets/fonts/BaksoMenu.ttf') format('truetype'); font-weight:100 900; font-style:normal; font-display:swap; }
@font-face{ font-family:'Prompt'; src:url('verana-assets/fonts/Prompt-Light.ttf') format('truetype'); font-weight:300; font-style:normal; font-display:swap; }
@font-face{ font-family:'Prompt'; src:url('verana-assets/fonts/Prompt-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
@font-face{ font-family:'Prompt'; src:url('verana-assets/fonts/Prompt-Medium.ttf') format('truetype'); font-weight:500; font-style:normal; font-display:swap; }
@font-face{ font-family:'Prompt'; src:url('verana-assets/fonts/Prompt-SemiBold.ttf') format('truetype'); font-weight:600; font-style:normal; font-display:swap; }
@font-face{ font-family:'Prompt'; src:url('verana-assets/fonts/Prompt-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
:root{
  --paper:#ffffff; --tinta:#111111;
  /* paleta oficial VERANA: 4 colorways (oscuro/relleno + claro/contorno) */
  --verde-osc:#005200; --verde-luz:#00e37a;
  --rojo:#d2002b; --rosa:#ffabbd;
  --morado:#560072; --lila:#dcabff;
  --azul:#04006f; --celeste:#86e7ff;
  --stroke:3px; --r:22px; --ease:cubic-bezier(.2,.9,.25,1);
  --display:'Bakso Menu',system-ui,-apple-system,sans-serif;
  --body:'Prompt',system-ui,-apple-system,sans-serif;
  /* isotipo "V" (LOGO-34.svg) esparcido a angulos variados, tenue, estilo papel de regalo.
     un solo <path> reutilizado via <use> para mantener el data-URI liviano. */
  --v-tossed:url('verana-assets/textures/verana-pattern-seamless.webp');
  --tex-tint:linear-gradient(rgba(0,40,0,.82),rgba(0,40,0,.82)); /* vela verde oscura translucida: atenua y oscurece la textura */
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--tinta);-webkit-font-smoothing:antialiased}
.wrap{width:min(1040px,94vw);margin-inline:auto}
.btn{font-family:var(--body);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;gap:.5em;
  padding:.75em 1.3em;border-radius:999px;border:var(--stroke) solid var(--tinta);background:var(--verde-luz);
  color:var(--verde-osc);cursor:pointer;box-shadow:0 5px 0 var(--tinta);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tinta)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:0 5px 0 var(--tinta)}
.btn.alt{background:var(--rojo);color:#fff}
.btn.ghost{background:transparent;color:var(--verde-osc)}
.kicker{display:inline-block;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;
  background:var(--verde-osc);color:var(--verde-luz);padding:.35em .8em;border-radius:999px}
/* header: mismo verde + textura tosca que el hero/builder, para una superficie continua */
/* banner superior: tono verde propio, sin la textura de V, para diferenciarlo del cuerpo */
.hdr{position:sticky;top:0;z-index:40;background:#013a00;border-bottom:3px solid var(--verde-luz);
  box-shadow:0 4px 0 rgba(0,0,0,.22);transition:box-shadow .2s var(--ease)}
.hdr--scrolled{box-shadow:0 7px 20px rgba(0,0,0,.4)}
.hdr__in{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.5rem 0;transition:padding .2s var(--ease)}
.hdr--scrolled .hdr__in{padding:.3rem 0}
.brand{display:inline-flex;align-items:center;text-decoration:none;transition:transform .15s var(--ease)}
.brand:hover{transform:rotate(-2deg) scale(1.03)}
.brand:focus-visible{outline:3px solid var(--verde-luz);outline-offset:4px;border-radius:12px}
.brand__logo{height:46px;width:auto;display:block;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35));transition:height .2s var(--ease)}
.hdr--scrolled .brand__logo{height:38px}
.hdr__nav{display:flex;gap:.4rem}
.hdr__nav a{font-family:var(--body);font-weight:700;font-size:.92rem;color:var(--verde-luz);text-decoration:none;
  padding:.42em .95em;border-radius:999px;border:2.5px solid transparent;
  transition:transform .15s var(--ease),background .15s,color .15s,border-color .15s,box-shadow .15s}
.hdr__nav a:hover{background:var(--verde-luz);color:var(--verde-osc);border-color:var(--tinta);box-shadow:0 3px 0 var(--tinta);transform:translateY(-1px)}
@media(max-width:820px){.hdr__nav{display:none}}
.hdr__right{display:flex;align-items:center;gap:.6rem}
.lang{display:flex;border:2.5px solid var(--tinta);border-radius:999px;overflow:hidden;font-weight:700;font-size:.8rem;box-shadow:0 3px 0 var(--tinta)}
.lang button{background:#fff;color:var(--verde-osc);border:none;padding:.42em .8em;cursor:pointer;font-family:var(--body);font-weight:700;transition:background .15s}
.lang button.on{background:var(--verde-luz);color:var(--verde-osc)}
.cartbtn{position:relative;width:46px;height:46px;border-radius:50%;border:var(--stroke) solid var(--tinta);
  background:var(--rojo);color:#fff;cursor:pointer;font-size:1.2rem;display:grid;place-content:center;box-shadow:0 4px 0 var(--tinta);transition:transform .15s var(--ease)}
.cartbtn:hover{transform:translateY(-2px) rotate(-5deg)}
.cartbtn__n{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;
  background:var(--verde-luz);border:2.5px solid var(--tinta);color:var(--verde-osc);font-size:.72rem;font-weight:700;display:grid;place-content:center}
.cartbtn.empty .cartbtn__n{display:none}
.sec{padding:2.2rem 0}
.sec__head{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;gap:.7rem;margin-bottom:1.2rem}
.sec__head h2{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4vw,2.4rem);margin:0}
.menu__peek{width:52px;height:auto;transform:rotate(-8deg);filter:drop-shadow(2px 3px 0 rgba(0,0,0,.25));pointer-events:none}
@media(max-width:560px){.menu__peek{display:none}}
/* seccion menu: full-width con fondo crema propio (no blanco puro) para pertenecer al sistema de marca;
   el <section> ya no lleva .wrap (ver HTML), asi que el fondo llega de borde a borde y un .wrap interno
   limita el contenido */
.menu-sec{background:#fbf4e6;padding:3.4rem 0 3.6rem}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.3rem}
/* tarjetas de sabor = stickers de colorway: ribbon superior en el color del sabor + cuerpo blanco.
   --fc/--fa/--fk llegan inline desde menuCardHTML (color, acento, tinta legible) */
.menu .mcard{border:var(--stroke) solid var(--tinta);border-radius:var(--r);background:#fff;overflow:hidden;
  box-shadow:0 6px 0 var(--tinta);display:flex;flex-direction:column;cursor:pointer;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.menu .mcard:nth-child(odd){--rot:-1.4deg}
.menu .mcard:nth-child(even){--rot:1.1deg}
.menu .mcard.reveal.in{transform:rotate(var(--rot,0))}
.menu .mcard.reveal.in:hover,.menu .mcard.reveal.in:focus-within{
  transform:rotate(0deg) translateY(-8px);box-shadow:0 13px 0 var(--tinta)}
.mcard__ribbon{position:relative;display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  background:var(--fc);color:var(--fk);padding:.65rem .8rem;border-bottom:var(--stroke) solid var(--tinta);overflow:hidden}
.mcard__iso{position:absolute;right:-8px;top:-12px;width:66px;height:66px;opacity:.2;pointer-events:none}
.mcard__iso svg{width:100%;height:100%;display:block}
.mcard__name{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1;position:relative;z-index:1}
.mcard__mini{width:50px;height:50px;object-fit:contain;flex:none;position:relative;z-index:1;
  filter:drop-shadow(2px 3px 0 rgba(0,0,0,.22))}
.mcard__body{padding:.85rem .95rem .3rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.mcard__benefit{font-size:.9rem;color:#333;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{font-size:.72rem;font-weight:600;border:2px solid var(--tinta);border-radius:999px;padding:.15em .6em;background:#fff}
.mcard__foot{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:auto;padding:.7rem .95rem .9rem}
.mcard__price{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--tinta)}
.mcard__price small{font-family:var(--body);font-weight:600;font-size:.68rem;opacity:.7}
.mcard__footbtns{display:flex;align-items:center;gap:.55rem}
.linkbtn{background:none;border:none;color:var(--verde-osc);font-weight:600;font-size:.8rem;cursor:pointer;padding:.2em 0;text-decoration:underline}
/* dividers de seccion: onda SVG que "corta" el color anterior hacia el siguiente, con trazo sticker encima */
.divider{position:relative;height:52px;line-height:0;overflow:hidden}
.divider svg{display:block;width:100%;height:100%}
.divider--toMenu{background:var(--verde-osc)}
.divider--toHow{background:#fbf4e6}
.divider--toFooter{background:var(--rosa)}
@media(max-width:640px){.divider{height:32px}}
/* modal genérico */
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:80;background:rgba(17,17,17,.5);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal{align-items:center}}
.modal__panel{background:#fff;width:min(560px,100%);max-height:88vh;overflow:auto;border:var(--stroke) solid var(--tinta);
  border-radius:24px 24px 0 0;padding:1.4rem;box-shadow:0 10px 0 var(--tinta),0 22px 44px rgba(0,0,0,.35)}
@media(min-width:600px){.modal__panel{border-radius:24px}}
.modal__head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.8rem}
.modal__head h3{font-family:var(--display);font-weight:400;margin:0;font-size:1.7rem}
.modal__x{background:#fff;border:2.5px solid var(--tinta);border-radius:50%;width:36px;height:36px;
  display:grid;place-content:center;font-size:1.15rem;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--tinta);
  transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.modal__x:hover{transform:translateY(-2px) rotate(-6deg)}
.modal__x:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tinta)}
.detail__block{margin:.8rem 0}
.detail__block h4{margin:0 0 .3rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--verde-osc)}
.detail__claim{background:var(--verde-luz);border:2.5px solid var(--tinta);border-radius:14px;padding:.7rem;font-weight:600}
/* superficie de marca continua: header + hero + builder comparten un mismo verde texturizado,
   sin divisores duros entre ellos. .topflow__bg lleva la textura y el parallax (ver JS);
   hero/builder quedan por encima en su propio nivel de apilamiento. */
.topflow{position:relative;overflow:hidden;background:var(--verde-osc);
  border-bottom:var(--stroke) solid var(--tinta)}
.topflow__bg{position:absolute;left:-2%;right:-2%;top:-90px;bottom:-90px;z-index:0;pointer-events:none;
  background:var(--tex-tint),var(--v-tossed) 0 0/560px auto repeat;will-change:transform}
/* franja hero: wordmark grande + Vera, protagonistas sobre la textura */
.hero{position:relative;z-index:1}
.hero__in{display:flex;align-items:center;justify-content:center;gap:1.6rem;flex-wrap:wrap;padding:3rem 0 2rem}
.hero__logo{width:min(620px,80vw);height:auto;filter:drop-shadow(4px 6px 0 rgba(0,0,0,.3))}
.hero__vera{width:clamp(80px,12vw,150px);height:auto;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.3))}
.hero__desc{max-width:600px;margin:-.2rem auto 0;padding:0 16px 1.4rem;text-align:center;color:rgba(255,255,255,.92);font-weight:500;font-size:clamp(1.02rem,2.2vw,1.2rem);line-height:1.55;position:relative;z-index:1;animation:heroPop .6s var(--ease) .26s both}
.hero__desc .hl{color:var(--verde-osc);background:var(--verde-luz);border-radius:8px;padding:.03em .4em;box-decoration-break:clone;-webkit-box-decoration-break:clone;font-weight:700}
.hero__natural{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;margin:0 auto .3rem;padding:0 16px;text-align:center;animation:heroPop .6s var(--ease) .2s both}
.hero__natural-row{display:flex;align-items:center;justify-content:center;gap:.55rem;flex-wrap:wrap}
.hero__natural-big{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,5vw,2.9rem);line-height:1;color:var(--verde-luz);text-shadow:3px 4px 0 rgba(0,0,0,.35)}
.hero__natural-dot{font-family:var(--display);color:var(--rosa);font-size:clamp(1.4rem,4vw,2.4rem);line-height:1}
.hero__natural-sub{font-family:var(--body);font-weight:600;font-size:clamp(.95rem,2.1vw,1.15rem);color:#fff;opacity:.92}
@media(max-width:640px){ .hero__vera{width:clamp(130px,40vw,200px)} }
.hero__glow{position:absolute;left:50%;top:42%;width:min(880px,116%);height:460px;transform:translate(-50%,-50%);z-index:0;pointer-events:none;background:radial-gradient(closest-side,rgba(0,227,122,.22),rgba(0,227,122,0) 70%)}
.hero__spark{position:absolute;pointer-events:none;background:var(--verde-luz);z-index:1;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25));animation:twinkle 2.8s ease-in-out infinite}
.hero__spark.s1{width:26px;height:26px;left:12%;top:30%}
.hero__spark.s2{width:18px;height:18px;right:16%;top:22%;background:var(--rosa);animation-delay:.8s}
.hero__spark.s3{width:16px;height:16px;left:26%;bottom:38%;background:var(--celeste);animation-delay:1.5s}
.hero__cta{display:flex;justify-content:center;padding:.2rem 0 3rem;position:relative;z-index:1;animation:heroPop .6s var(--ease) .4s both}
.hero__cta a{font-family:var(--display);font-weight:400;font-size:clamp(1.2rem,3vw,1.5rem);padding:.5em 1.4em;background:var(--rojo);color:#fff;transform:rotate(-1.6deg)}
.hero__cta a:hover{transform:rotate(-1.6deg) translateY(-3px);box-shadow:0 9px 0 var(--tinta)}
@keyframes twinkle{0%,100%{transform:scale(.65) rotate(0);opacity:.3}50%{transform:scale(1.1) rotate(18deg);opacity:.95}}
@keyframes heroPop{0%{opacity:0;transform:translateY(20px) scale(.92)}60%{transform:translateY(-5px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
.hero__logo{animation:heroPop .7s var(--ease) both}
.hero__vera{animation:heroPop .7s var(--ease) .12s both}
.builder{position:relative;z-index:1;color:#fff}
.builder .wrap{padding:1.6rem 0 2rem}
.builder__head{text-align:center}
.builder__head h2{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,5vw,2.8rem);margin:.2rem 0}
.builder__hint{opacity:.9;margin:.2rem 0 1rem}
.stage{width:100%}
/* escena: caja "cajita feliz" ilustrada + Vera al lado */
.scene{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.1rem;padding-top:1.4rem}
.carton{position:relative;flex:0 1 480px;min-width:0;max-width:480px;aspect-ratio:220/170}
.carton__art{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block;
  filter:drop-shadow(3px 5px 0 rgba(0,58,0,.4)) drop-shadow(9px 13px 0 rgba(0,0,0,.4));
  transform-origin:50% 90%}
.carton.wiggle .carton__art{animation:boxWiggle .55s var(--ease)}
@keyframes boxWiggle{
  0%{transform:rotate(0) translateY(0)}
  18%{transform:rotate(-2deg) translateY(-3px) scale(1.02)}
  40%{transform:rotate(1.6deg) translateY(1px)}
  62%{transform:rotate(-1deg)}
  82%{transform:rotate(.4deg)}
  100%{transform:rotate(0) translateY(0)}
}
.box2d{display:grid;grid-template-columns:repeat(5,1fr);gap:.55rem;width:min(430px,94%);
  background:rgba(0,0,0,.2);border:var(--stroke) solid var(--tinta);border-radius:18px;padding:.6rem;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.box2d.wiggle{animation:boxWiggle .5s var(--ease)}
.slot{position:relative;overflow:visible;aspect-ratio:1;border:2.5px dashed rgba(255,255,255,.4);border-radius:14px;
  display:flex;align-items:center;justify-content:center;min-height:0}
.slot.filled{border-style:solid;border-color:var(--tinta);cursor:pointer}
.slot.waiting{animation:waitPulse 1.1s ease-in-out infinite}
@keyframes waitPulse{50%{border-color:rgba(17,17,17,.12)}}
.slotItem{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.miniVera{width:88%;height:auto;max-height:100%;object-fit:contain;display:block;
  filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3))}
.slot.filled.land .slotItem{animation:landPop .5s var(--ease)}
@keyframes landPop{
  0%{transform:translateY(-14px) scale(.55,1.32);opacity:.65}
  40%{transform:translateY(6px) scale(1.22,.82)}
  62%{transform:translateY(-5px) scale(.93,1.08)}
  82%{transform:translateY(2px) scale(1.04,.98)}
  100%{transform:translateY(0) scale(1,1);opacity:1}
}
/* poof al quitar una bolsita de la caja */
.poofPuff{position:absolute;top:55%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:rgba(255,255,255,.92);opacity:0;pointer-events:none}
.poofPuff.p1{--px:-16px;--py:-18px}
.poofPuff.p2{--px:14px;--py:-22px}
.poofPuff.p3{--px:0px;--py:-28px}
.slot.poof{cursor:default}
/* misma especificidad que .slot.filled.land .slotItem (4 clases) pero declarada despues: el poof
   siempre gana si un slot todavia trae la clase "land" de su animacion de llegada */
.slot.filled.poof .slotItem{animation:poofShrink .26s ease-in forwards}
.slot.poof .poofPuff{animation:poofOut .3s ease-out forwards}
.slot.poof .poofPuff.p2{animation-delay:.02s}
.slot.poof .poofPuff.p3{animation-delay:.04s}
@keyframes poofShrink{0%{transform:scale(1);opacity:1}100%{transform:scale(.25) translateY(-6px);opacity:0}}
@keyframes poofOut{0%{transform:translate(0,0) scale(.3);opacity:.9}100%{transform:translate(var(--px,0),var(--py,-22px)) scale(1.15);opacity:0}}
/* efecto de llegada: anillo pop + chispas + lineas de movimiento */
.burst{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:4}
.burstRing{position:absolute;top:38%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  border:4px solid var(--fa,#fff);animation:ringPop .5s var(--ease) forwards}
@keyframes ringPop{0%{transform:scale(.3);opacity:1}70%{opacity:.55}100%{transform:scale(3.1);opacity:0;border-width:1px}}
.spark{position:absolute;top:38%;left:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:var(--fc,#fff);
  border:2px solid var(--fa,#111);opacity:0;animation:sparkOut .55s cubic-bezier(.2,.9,.3,1) forwards}
.spark.s1{--tx:38px;--ty:-6px}.spark.s2{--tx:22px;--ty:-30px}.spark.s3{--tx:-10px;--ty:-36px}
.spark.s4{--tx:-34px;--ty:-10px}.spark.s5{--tx:-20px;--ty:20px}.spark.s6{--tx:18px;--ty:22px}
@keyframes sparkOut{
  0%{transform:translate(0,0) rotate(20deg) scale(0);opacity:0}
  25%{opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) rotate(120deg) scale(1);opacity:0}
}
.mline{position:absolute;top:18%;left:50%;width:3px;height:20px;margin:0 0 0 -1.5px;border-radius:3px;
  background:var(--fa,#fff);opacity:0;animation:mlineFade .3s ease-out forwards}
.mline.m1{transform:rotate(-26deg) translateY(-6px)}
.mline.m2{transform:rotate(0deg) translateY(-14px)}
.mline.m3{transform:rotate(26deg) translateY(-6px)}
@keyframes mlineFade{0%{opacity:.9;height:22px}100%{opacity:0;height:8px}}
/* item volador: arco desde el sabor tocado hasta la caja (WAAPI, ver JS) */
.flyVera{position:fixed;z-index:200;pointer-events:none;filter:drop-shadow(2px 4px 0 rgba(0,0,0,.35));will-change:transform}
/* Vera junto a la caja: idle bob + reacción al llegar a 5/5 */
.vera{position:relative;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding-bottom:2%}
.vera__imgs{position:relative;width:clamp(240px,52vw,380px);transform-origin:50% 92%;animation:veraBob 3.2s ease-in-out infinite}
.vera.full .vera__imgs{animation:veraBob 3.2s ease-in-out infinite,veraCelebrate .7s var(--ease)}
.vera__img{display:block;width:100%;height:auto;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.35));transition:opacity .24s var(--ease)}
.vera__img--closed{position:absolute;inset:0;opacity:0}
/* idle de charme: guino/parpadeo sutil cada ~9s (escala vertical breve), independiente del bob del padre */
.vera__img--open{animation:veraWink 9s ease-in-out infinite;transform-origin:50% 42%}
@keyframes veraWink{
  0%,92%,100%{transform:scaleY(1)}
  94%{transform:scaleY(.86)}
  96%{transform:scaleY(1.04)}
  98%{transform:scaleY(1)}
}
.vera.full .vera__img--open{opacity:0}
.vera.full .vera__img--closed{opacity:1}
@keyframes veraBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes veraCelebrate{
  0%{transform:scale(1) rotate(0)}
  30%{transform:scale(1.2) rotate(-9deg)}
  55%{transform:scale(.94) rotate(7deg)}
  75%{transform:scale(1.08) rotate(-3deg)}
  100%{transform:scale(1) rotate(0)}
}
.vera__bubble{position:absolute;top:-1.4rem;left:50%;transform:translateX(-50%) translateY(0) scale(.7);opacity:0;
  pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);background:#fff;color:var(--tinta);
  border:var(--stroke) solid var(--tinta);border-radius:14px;padding:.35rem .75rem;font-weight:700;font-size:.85rem;
  box-shadow:0 4px 0 var(--tinta);white-space:nowrap;z-index:2}
.vera__bubble::after{content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  border:9px solid transparent;border-top-color:#fff}
.vera.full .vera__bubble{opacity:1;transform:translateX(-50%) translateY(-.6rem) scale(1)}
/* confeti radial alrededor de Vera al llegar a 5/5 */
.veraConfetti{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:1}
.veraConfetti span{position:absolute;top:32%;left:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
  border-radius:2px;opacity:0}
.veraConfetti span:nth-child(1){background:var(--verde-luz)}
.veraConfetti span:nth-child(2){background:var(--rosa)}
.veraConfetti span:nth-child(3){background:var(--celeste)}
.veraConfetti span:nth-child(4){background:var(--lila)}
.veraConfetti span:nth-child(5){background:var(--rojo)}
.veraConfetti span:nth-child(6){background:var(--verde-luz)}
.vera.full .veraConfetti span{animation:veraConfettiPop .9s var(--ease) forwards}
.vera.full .veraConfetti span:nth-child(1){--tx:-46px;--ty:-36px;animation-delay:.05s}
.vera.full .veraConfetti span:nth-child(2){--tx:-18px;--ty:-62px;animation-delay:.1s}
.vera.full .veraConfetti span:nth-child(3){--tx:20px;--ty:-58px;animation-delay:.02s}
.vera.full .veraConfetti span:nth-child(4){--tx:46px;--ty:-28px;animation-delay:.14s}
.vera.full .veraConfetti span:nth-child(5){--tx:32px;--ty:14px;animation-delay:.08s}
.vera.full .veraConfetti span:nth-child(6){--tx:-32px;--ty:16px;animation-delay:.16s}
@keyframes veraConfettiPop{
  0%{transform:translate(0,0) rotate(0) scale(0);opacity:0}
  30%{opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) rotate(140deg) scale(1);opacity:0}
}
.hidden{display:none!important}
@media(max-width:720px){
  .scene{flex-direction:column;align-items:center;padding-top:2.4rem;gap:.8rem}
  .carton{width:100%}
  .vera{padding-bottom:0}
  .vera__imgs{width:clamp(210px,64vw,300px)}
}
/* controles */
.picker{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}
.fbtn{flex:1 1 30%;min-width:120px;font-family:var(--body);font-weight:700;color:var(--tinta);
  border:var(--stroke) solid var(--tinta);border-radius:14px;padding:.7rem;cursor:pointer;box-shadow:0 4px 0 var(--tinta);
  transition:transform .1s var(--ease),box-shadow .1s var(--ease),filter .1s var(--ease)}
.fbtn:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 var(--tinta);filter:brightness(1.25) saturate(1.3)}
.fbtn:disabled{opacity:.5}
/* flash de color al soltar un sabor en la caja (clase temporal, ver renderPicker) */
.fbtn--flash{animation:fbtnFlash .38s var(--ease)}
@keyframes fbtnFlash{0%{filter:brightness(1.65) saturate(1.5);transform:scale(1.1)}100%{filter:none;transform:scale(1)}}
.builder__bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  background:#fff;color:var(--tinta);border:var(--stroke) solid var(--tinta);border-radius:var(--r);padding:1rem;
  box-shadow:0 3px 0 var(--verde-luz),0 8px 0 rgba(0,0,0,.25)}
.builder__meta{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.counterWrap{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem}
.counter{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1;display:inline-block;
  background:var(--verde-luz);color:var(--verde-osc);border:2.5px solid var(--tinta);border-radius:999px;
  padding:.2em .8em;box-shadow:0 3px 0 var(--tinta)}
.progress{display:flex;gap:.3rem;padding-left:.2rem}
.progress__dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--tinta);background:#fff;
  transition:transform .2s var(--ease)}
.progress__dot.on{transform:scale(1.15)}
/* el ultimo punto que se llena "pop-ea" (clase temporal, ver renderProgressDots) */
.progress__dot.pop{animation:dotPop .4s var(--ease)}
@keyframes dotPop{0%{transform:scale(.3)}55%{transform:scale(1.5)}100%{transform:scale(1.15)}}
.builder__price{font-family:var(--body);font-weight:800;font-size:1.1rem;color:#fff;background:var(--rojo);

.builder__price:empty{display:none}

.cartrow__name{font-weight:600;font-size:.95rem}
.cartrow__ctrl{display:flex;align-items:center;gap:.5rem}
.qtybtn{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--tinta);background:var(--verde-luz);color:var(--verde-osc);

.qtybtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--tinta)}
.cart__total{display:flex;align-items:baseline;justify-content:space-between;margin:1rem 0;font-size:1.2rem;font-weight:700}
.cart__total b{font-family:var(--display);font-weight:400;font-size:1.9rem;color:var(--rojo)}

.how .wrap{padding:2.2rem 0 2.6rem}
.how__row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:.4rem}
/* tarjeta-sticker por paso: icono dibujado + numero + texto, ligera rotacion que se endereza al hover */
.how__step{position:relative;background:#fff;border:var(--stroke) solid var(--tinta);border-radius:20px;
  box-shadow:0 6px 0 var(--tinta);padding:1.3rem 1rem 1.1rem;display:flex;flex-direction:column;
  align-items:center;text-align:center;gap:.5rem;transform:rotate(var(--rot,0));
  transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.how__step:hover{transform:rotate(0deg) translateY(-5px);box-shadow:0 11px 0 var(--tinta)}
.how__icon{width:56px;height:56px;display:block}
.how__icon svg{width:100%;height:100%;display:block}
.how__num{font-family:var(--display);font-weight:400;font-size:1.05rem;background:var(--rojo);color:#fff;
  width:28px;height:28px;border-radius:50%;display:grid;place-content:center;border:2.5px solid var(--tinta)}
.how__text{font-weight:600;font-size:.92rem}
.how__connector{width:44px;height:20px;display:block;justify-self:center;align-self:center}
@media(max-width:640px){

}

.footer{background:var(--verde-osc);color:var(--verde-luz);padding:2rem 0}
.footer__legal{font-weight:300;font-size:.75rem;opacity:.9;line-height:1.5;margin:0;text-align:center}
/* estado vacío del carrito y feedback de "añadido": aparece Vera */
.cart-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4rem;padding:.5rem 0 .2rem}
.cart-empty img{width:104px;height:104px;object-fit:contain}
.cart-empty p{margin:0;font-size:.95rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,140%);z-index:120;display:flex;align-items:center;gap:.6rem;
  background:var(--verde-osc);color:#fff;border:var(--stroke) solid var(--tinta);border-radius:999px;padding:.4rem .9rem .4rem .4rem;
  box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .28s var(--ease);max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.toast img{width:40px;height:40px;object-fit:contain;flex:none}
.toast span{font-weight:600;font-size:.88rem;line-height:1.2}
@media(max-width:520px){

/* reveal-on-scroll: fade + slide up al entrar en viewport (ver IntersectionObserver en JS) */
.reveal{opacity:0;transform:translateY(26px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:translateY(0)}

.menu .mcard:nth-child(1){transition-delay:.02s}

.how__step:nth-child(5){transition-delay:.16s}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

@media(prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important;transition:none!important} }

<script type="module">
const CONFIG = {
  PANELAS_POR_BOLSA: 3,        // 3 panelas = 1 bolsa = 1 smoothie
  BOX_SIZE: 5,                 // bolsitas por caja
  PRICE: { packUnit: 3.75, single: 4.90 },  // referencia, editable
  WA_NUMBER: '35699653967',
};

// Espejo de verana-panelas.xlsx (VR-01..VR-05). claim:'efsa' cita textual; claim:'ing' solo describe ingrediente.

// Tinta legible sobre un color de sabor: blanco en fondos oscuros, negro en claros.
function inkOn(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255, b = parseInt(h.slice(4,6),16)/255;
  const L = 0.2126*r + 0.7152*g + 0.0722*b; // luminancia relativa aproximada
  return L < 0.55 ? '#fff' : '#111';
}

// Composición legible y firma estable para agrupar cajas idénticas en el carrito.
function boxComposition(ids){
  const counts = {};
  ids.forEach(id => { counts[id] = (counts[id]||0)+1; });
  const order = FLAVORS.map(f=>f.id).filter(id=>counts[id]);
  return {
    label: order.map(id => `${counts[id]} ${FLAVOR_BY_ID[id].name[LANG]}`).join(', '),
    sig: order.map(id => `${id}${counts[id]}`).join('-'),
  };
}

const cartCount = () => Object.values(cart).reduce((s,i)=>s+i.qty,0);
const cartTotal = () => Object.values(cart).reduce((s,i)=>s+i.price*i.qty,0);
function saveCart(){ try{ localStorage.setItem('verana_cart', JSON.stringify(cart)); }catch(e){} }

function addBoxToCart(){
  if (!boxFull()) return false;
  const { sig } = boxComposition(box);
  const lineId = 'box-'+sig;
  if (!cart[lineId]) cart[lineId] = { kind:'box', ids:[...box], price:PACK_PRICE, qty:0 };
  cart[lineId].qty++;
  saveCart(); return true;
}
function addSingle(flavorId){

  const lineId = 'single-'+flavorId;

  cart[lineId].qty++;
  saveCart(); return true;
}

function renderBox2D(animateIndices){

  const slots = Array.from({length: CONFIG.BOX_SIZE}, (_,i)=>{

      return `<div class="slot filled${land}" data-remove="${i}" title="${nameOf(f)}">

        <span class="poofPuff p1"></span><span class="poofPuff p2"></span><span class="poofPuff p3"></span>
      </div>`;
    }
    return `<div class="slot${waiting ? ' waiting' : ''}"></div>`;

  $('#box2d').innerHTML = slots;

// Precio del builder: roll/count-up rapido entre el valor anterior y el nuevo (WAAPI-free, rAF).
let lastPriceVal = 0;
function animatePrice(newVal){
  const el = $('#builderPrice');
  if (!newVal){ el.textContent = ''; lastPriceVal = 0; return; }
  if (REDUCED_MOTION || Math.abs(newVal-lastPriceVal) < .001){ el.textContent = fmt(newVal); lastPriceVal = newVal; return; }
  const startVal = lastPriceVal, start = performance.now(), dur = 260;
  function step(now){
    const p = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = fmt(Math.max(0, startVal + (newVal-startVal)*eased));
    if (p < 1) requestAnimationFrame(step); else { el.textContent = fmt(newVal); lastPriceVal = newVal; }
  }
  requestAnimationFrame(step);
}
function renderBuilder(){
  $('#builderTitle').textContent = t('builder_title');
  $('#builderHint').textContent  = boxFull() ? t('box_full_hint') : t('builder_hint');
  $('#btnPreset').textContent    = t('preset');
  $('#btnClear').textContent     = t('clear');
  $('#counter').textContent      = t('counter')(boxCount());
  animatePrice(boxCount() ? boxLivePrice() : 0);
  const addBtn = $('#btnAddBox');
  addBtn.textContent = t('add_box');
  addBtn.disabled = !boxFull() || flightPending.size>0;
  renderPicker();
  renderBox2D(pendingAnimate); pendingAnimate = null;
  renderProgressDots();
  renderVera();
  // desactivar botones de sabor si la caja está llena
  document.querySelectorAll('.fbtn').forEach(b => b.disabled = boxFull());
}

function wiggleBox(){
  const c = document.getElementById('box2d');
  if(!c) return;
  c.classList.remove('wiggle'); void c.offsetWidth; c.classList.add('wiggle');
}

// Vuela una mini Vera (colorway del sabor) en arco desde el botón tocado hasta el slot destino,
// con squash/stretch. Al aterrizar: quita el elemento volador, marca el slot como "land" (burst)
// y hace vibrar la caja. Usa la Web Animations API (sin dependencias nuevas).
function flyMiniVera(sourceEl, slotEl, flavor, idx){
  const startR = sourceEl.getBoundingClientRect();
  const endR = (slotEl || $('#box2d')).getBoundingClientRect();
  const size = Math.max(30, Math.min(endR.width, endR.height) * .92);
  const img = document.createElement('img');
  img.src = flavor.mini; img.alt = ''; img.className = 'flyVera';
  img.style.width = size + 'px'; img.style.height = 'auto';
  img.style.left = (startR.left + startR.width/2 - size/2) + 'px';
  img.style.top  = (startR.top + startR.height/2 - size/2) + 'px';
  document.body.appendChild(img);

  const dx = (endR.left + endR.width/2) - (startR.left + startR.width/2);
  const dy = (endR.top + endR.height*0.78) - (startR.top + startR.height/2);
  const lift = -Math.max(110, Math.abs(dy)*0.85 + 70);
  const kf = [
    { transform:'translate(0px,0px) scale(.35) rotate(-20deg)', offset:0,   opacity:0 },
    { transform:`translate(${dx*.16}px,${dy*.16+lift*.4}px) scale(1.25) rotate(10deg)`,  offset:.24, opacity:1 },
    { transform:`translate(${dx*.5}px,${dy*.5+lift}px) scale(1.05) rotate(-8deg)`,       offset:.55, opacity:1 },
    { transform:`translate(${dx*.84}px,${dy*.84+lift*.22}px) scale(1.18,.8) rotate(6deg)`, offset:.84, opacity:1 },
    { transform:`translate(${dx}px,${dy}px) scale(.6,1.3) rotate(0deg)`,  offset:.93, opacity:1 },
    { transform:`translate(${dx}px,${dy}px) scale(1,1) rotate(0deg)`,     offset:1,   opacity:1 },
  ];
  const anim = img.animate(kf, { duration:640, easing:'cubic-bezier(.33,0,.2,1)', fill:'forwards' });
  const done = anim.finished ? anim.finished.catch(()=>{}) : new Promise(res => { anim.onfinish = res; });
  done.then(()=>{
    img.remove();
    flightPending.delete(idx);
    pendingAnimate = [idx];
    renderBuilder();
    wiggleBox();
  });
}

// Vuela un item pequeño (mini Vera del sabor, o Vera generica) en arco desde el boton de "añadir"
// hasta el icono del carrito (#cartBtn), en el mismo espiritu que flyMiniVera. Se resuelve al instante
// (sin animar) si el usuario prefiere menos movimiento o falta alguno de los elementos.
function flyToCart(sourceEl, imgSrc){
  if (REDUCED_MOTION || !sourceEl) return Promise.resolve();
  const cartEl = $('#cartBtn');
  if (!cartEl) return Promise.resolve();
  const startR = sourceEl.getBoundingClientRect();
  const endR = cartEl.getBoundingClientRect();
  const size = 32;
  const img = document.createElement('img');
  img.src = imgSrc; img.alt = ''; img.className = 'flyVera';
  img.style.width = size + 'px'; img.style.height = 'auto';
  img.style.left = (startR.left + startR.width/2 - size/2) + 'px';
  img.style.top  = (startR.top + startR.height/2 - size/2) + 'px';
  document.body.appendChild(img);
  const dx = (endR.left + endR.width/2) - (startR.left + startR.width/2);
  const dy = (endR.top + endR.height/2) - (startR.top + startR.height/2);
  const lift = -Math.max(90, Math.abs(dy)*0.6 + 60);
  const kf = [
    { transform:'translate(0px,0px) scale(.5) rotate(-10deg)', offset:0,   opacity:0 },
    { transform:`translate(${dx*.2}px,${dy*.2+lift*.5}px) scale(1.1) rotate(8deg)`,   offset:.28, opacity:1 },
    { transform:`translate(${dx*.6}px,${dy*.6+lift}px) scale(.9) rotate(-6deg)`,      offset:.62, opacity:1 },
    { transform:`translate(${dx*.9}px,${dy*.9+lift*.15}px) scale(.55) rotate(4deg)`,  offset:.9,  opacity:.9 },
    { transform:`translate(${dx}px,${dy}px) scale(.15) rotate(0deg)`,                 offset:1,   opacity:0 },
  ];
  const anim = img.animate(kf, { duration:560, easing:'cubic-bezier(.33,0,.2,1)', fill:'forwards' });
  const done = anim.finished ? anim.finished.catch(()=>{}) : new Promise(res => { anim.onfinish = res; });
  return done.then(()=>{ img.remove(); });
}

function boxAdd(id, sourceEl){
  if(!addToBox(id)) return;
  lastAddedFlavor = id; lastAddedAt = Date.now();
  const idx = box.length-1;
  if (REDUCED_MOTION || !sourceEl){
    pendingAnimate = [idx];
    renderBuilder();
    if(!REDUCED_MOTION) wiggleBox();
    return;
  }
  flightPending.add(idx);
  renderBuilder(); // contador/precio ya reflejan el nuevo item; el slot se ve "waiting" hasta aterrizar
  const slotEl = $('#box2d').children[idx];
  flyMiniVera(sourceEl, slotEl, FLAVOR_BY_ID[id], idx);
}
function boxRemove(i){
  if (i<0 || i>=box.length || poofing.has(i)) return;
  if (REDUCED_MOTION){ if(removeFromBoxAt(i)) renderBuilder(); return; }
  poofing.add(i);
  const slotEl = $('#box2d').children[i];
  if (slotEl) slotEl.classList.add('poof');
  setTimeout(()=>{
    poofing.delete(i);
    if(removeFromBoxAt(i)) renderBuilder();
  }, 260);
}

// ---- Efectos de scroll: reveal-on-scroll (IntersectionObserver) + parallax sutil (scroll) ----
// Ambos se saltan por completo si el usuario prefiere menos movimiento.
let revealObserver = null;
function ensureRevealObserver(){
  if (revealObserver || !('IntersectionObserver' in window)) return revealObserver;
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('in');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold:.15 });
  return revealObserver;
}
function initReveal(){
  if (REDUCED_MOTION) return;
  const obs = ensureRevealObserver();
  document.querySelectorAll('.reveal').forEach(el=>{
    if (el.dataset.revealObserved) return;
    el.dataset.revealObserved = '1';
    if (obs) obs.observe(el); else el.classList.add('in');
  });
}

// Parallax: la textura de fondo (y el logo/Vera del hero) se desplazan a una fracción
// del scroll, atados a la posición propia de #topFlow (no al scrollY absoluto) para
// que el efecto sea proporcional y se detenga con naturalidad al salir de vista.
// Escritura directa de transform en cada evento de scroll (sin rAF): son solo un par
// de estilos por evento, sin lectura de layout intercalada que fuerce reflow, asi que
// no hay layout thrash; evita ademas depender de rAF, que algunos navegadores/pestañas
// en segundo plano pueden pausar o retrasar.
function initParallax(){
  if (REDUCED_MOTION) return;
  const topFlowEl = document.getElementById('topFlow');
  const bgEl = document.getElementById('topFlowBg');
  const heroInEl = document.getElementById('heroIn');
  if (!topFlowEl || !bgEl) return;
  function update(){
    const rect = topFlowEl.getBoundingClientRect();
    if (rect.bottom < 0 || rect.top > window.innerHeight) return;
    const progress = -rect.top;
    const bgShift = Math.max(-70, Math.min(70, progress * 0.16));
    bgEl.style.transform = `translate3d(0, ${bgShift}px, 0)`;
    if (heroInEl){
      const heroShift = Math.max(-24, Math.min(24, progress * 0.06));
      heroInEl.style.transform = `translate3d(0, ${heroShift}px, 0)`;
    }
  }
  window.addEventListener('scroll', update, { passive:true });
  update();
}

// Aserciones de lógica pura. Ejecutar en consola: VERANA_SELFTEST()
window.VERANA_SELFTEST = function(){
  const A = (cond, msg) => { if(!cond) throw new Error('SELFTEST FALLÓ: '+msg); };
  // reset
  box = []; cart = {};
  A(boxCount()===0, 'caja arranca vacía');
  presetOnePerDay();
  A(boxCount()===5 && new Set(box).size===5, 'preset = 5 sabores distintos');
  A(!addToBox('gl'), 'no se puede exceder BOX_SIZE');
  clearBox(); A(boxCount()===0, 'clearBox vacía');
  A(addToBox('en') && addToBox('en'), 'repetición permitida');
  A(Math.abs(boxLivePrice() - 2*CONFIG.PRICE.packUnit) < 1e-9, 'precio en vivo por unidad');
  const comp = boxComposition(['gl','en','en']);
  A(comp.sig==='gl1-en2', 'firma de composición estable');
  // llenar y agregar caja
  box = ['gl','gl','en','pe','li']; A(boxFull(),'caja llena');
  A(addBoxToCart(), 'agrega caja al carrito');
  A(Math.abs(cartTotal() - PACK_PRICE) < 1e-9, 'total = precio de pack');
  addSingle('pr'); A(cartCount()===2, 'suma bolsita suelta');
  const msg = waMessage('Ana','martes');
  A(msg.includes('Ana') && msg.includes(t('wa_total')), 'mensaje WA con nombre y total');
  cart = {}; box = []; saveCart();
  console.log('%cVERANA_SELFTEST OK','color:#005011;font-weight:700');
  return true;
};
